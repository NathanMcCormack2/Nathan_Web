<svg width="500" height="500" viewBox="0 0 680 680" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Mario's Pizzeria — Galway, Ireland — Est. 1994</title>
<desc>Circular vintage badge logo for Mario's Pizzeria, Galway Ireland, established 1994.</desc>
<defs>
  <path id="pzl-top" d="M 28,340 a 312,312 0 0,1 624,0"/>
  <path id="pzl-bot" d="M 28,340 a 312,312 0 0,0 624,0"/>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Lobster&amp;family=Alfa+Slab+One&amp;family=Josefin+Sans:wght@700&amp;display=swap');
    .pzl-script { font-family: 'Lobster', cursive; }
    .pzl-slab   { font-family: 'Alfa Slab One', 'Rockwell', serif; }
    .pzl-sans   { font-family: 'Josefin Sans', 'Arial Narrow', sans-serif; font-weight: 700; }
  </style>
</defs>

<!-- Outer deep red badge -->
<circle cx="340" cy="340" r="332" fill="#C03030"/>

<!-- Gold ring borders -->
<circle cx="340" cy="340" r="323" fill="none" stroke="#D4A520" stroke-width="2.8"/>
<circle cx="340" cy="340" r="316" fill="none" stroke="#D4A520" stroke-width="0.8" opacity="0.5"/>
<circle cx="340" cy="340" r="308" fill="none" stroke="rgba(255,248,230,0.12)" stroke-width="1"/>

<!-- Circular text — top -->
<text class="pzl-sans" font-size="15.5" fill="#FAF3E0" letter-spacing="5.5" text-anchor="middle">
  <textPath href="#pzl-top" startOffset="50%">MARIO'S ORIGINAL PIZZERIA  ·  GALWAY</textPath>
</text>

<!-- Circular text — bottom -->
<text class="pzl-sans" font-size="13.5" fill="#D4A520" letter-spacing="4.5" text-anchor="middle">
  <textPath href="#pzl-bot" startOffset="50%">·  ESTABLISHED  1994  ·  IRELAND  ·</textPath>
</text>

<!-- Inner cream circle -->
<circle cx="340" cy="340" r="298" fill="#FAF3E0"/>
<circle cx="340" cy="340" r="298" fill="none" stroke="#D4A520" stroke-width="1.8" opacity="0.5"/>

<!-- ── PIZZA ILLUSTRATION ── -->
<!-- Golden crust base -->
<circle cx="340" cy="250" r="92" fill="#E0A018"/>
<!-- Tomato sauce -->
<circle cx="340" cy="250" r="78" fill="#C03030"/>

<!-- Mozzarella cheese blobs -->
<ellipse cx="336" cy="242" rx="29" ry="26" fill="#FFF8C0" opacity="0.94" transform="rotate(-12,336,242)"/>
<ellipse cx="372" cy="254" rx="22" ry="19" fill="#FFF4B0" opacity="0.91" transform="rotate(20,372,254)"/>
<ellipse cx="310" cy="258" rx="23" ry="21" fill="#FFF8C0" opacity="0.91" transform="rotate(-16,310,258)"/>
<ellipse cx="352" cy="272" rx="18" ry="16" fill="#FFFAD0" opacity="0.89"/>
<ellipse cx="324" cy="228" rx="16" ry="14" fill="#FFF4B0" opacity="0.86" transform="rotate(10,324,228)"/>
<ellipse cx="363" cy="232" rx="14" ry="12" fill="#FFF8C0" opacity="0.86" transform="rotate(-22,363,232)"/>

<!-- Slice lines (6-way cut) -->
<line x1="340" y1="158" x2="340" y2="342" stroke="#B08010" stroke-width="1.3" opacity="0.28"/>
<line x1="261" y1="204" x2="419" y2="296" stroke="#B08010" stroke-width="1.3" opacity="0.28"/>
<line x1="419" y1="204" x2="261" y2="296" stroke="#B08010" stroke-width="1.3" opacity="0.28"/>

<!-- Basil leaves -->
<ellipse cx="346" cy="237" rx="6.5" ry="12.5" fill="#2A7A14" transform="rotate(-28,346,237)"/>
<ellipse cx="325" cy="264" rx="5.5" ry="10.5" fill="#368A1A" transform="rotate(40,325,264)"/>
<ellipse cx="366" cy="263" rx="5.5" ry="10.5" fill="#2A7A14" transform="rotate(-50,366,263)"/>

<!-- Olive toppings -->
<circle cx="318" cy="237" r="5.5" fill="#8B2808"/>
<circle cx="318" cy="237" r="2.5" fill="#5A1808"/>
<circle cx="360" cy="228" r="5"   fill="#8B2808"/>
<circle cx="360" cy="228" r="2.2" fill="#5A1808"/>
<circle cx="376" cy="260" r="4.8" fill="#8B2808"/>
<circle cx="376" cy="260" r="2.1" fill="#5A1808"/>
<circle cx="332" cy="272" r="4.2" fill="#8B2808"/>
<circle cx="332" cy="272" r="1.8" fill="#5A1808"/>

<!-- Crust ring overlay -->
<circle cx="340" cy="250" r="92" fill="none" stroke="#B08010" stroke-width="14"/>
<circle cx="340" cy="250" r="92" fill="none" stroke="#C03030" stroke-width="1" opacity="0.35"/>

<!-- ── BRAND TEXT ── -->
<text class="pzl-sans" font-size="12" fill="#D4A520" text-anchor="middle" x="340" y="366" letter-spacing="22" opacity="0.85">✦  ✦  ✦</text>

<!-- Mario's wordmark -->
<text class="pzl-script" font-size="72" fill="#C03030" text-anchor="middle" x="340" y="430">Mario's</text>

<!-- Gold divider -->
<line x1="155" y1="443" x2="525" y2="443" stroke="#D4A520" stroke-width="1.4" opacity="0.6"/>

<!-- PIZZERIA -->
<text class="pzl-slab" font-size="25" fill="#3D1E0A" text-anchor="middle" x="340" y="476" letter-spacing="9">PIZZERIA</text>

<!-- Location tag -->
<text class="pzl-sans" font-size="11.5" fill="#9A6B48" text-anchor="middle" x="340" y="502" letter-spacing="4.5">GALWAY  ·  IRELAND</text>

</svg>
